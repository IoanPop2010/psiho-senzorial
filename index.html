<style>

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;

.glos b{font-family:var(--f-display);font-weight:700}
.glos small{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:6px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const LESSONS={S2:"S2 Psihicul",S22:"S2.2 Ipostaze",S3:"S3 Procese senzoriale",S4:"S4 Senzații",S5:"S5 Percepții"};
const D=[
["S2","Psihologia","știința care studiază procesele psihice și comportamentul uman, prin metode științifice."],
["S2","Simț comun","cunoștințe și explicații dobândite din experiența proprie, observație, familie, cultură și relații."],
["S2","Metode de cercetare","observația, experimentul, chestionarul, interviul, studiul de caz."],
["S2","Psihic","ansamblul proceselor, stărilor și activităților prin care omul cunoaște lumea și propria persoană, se adaptează la mediu și își reglează comportamentul."],
["S2","Psihic obiectiv","activitatea psihică are bază biologică (creier, sistem nervos) și este influențată de realitate."],
["S2","Psihic subiectiv","fiecare persoană percepe și interpretează realitatea în mod propriu."],
["S2","Psihic material","are la bază activitatea creierului și a sistemului nervos."],
["S2","Psihic ideal","gândurile, amintirile, emoțiile și imaginile mintale nu sunt obiecte materiale."],
["S2","Psihic ca proces","activitate desfășurată în timp, cu transformarea continuă a informațiilor."],
["S2","Psihic ca produs","rezultatele activității psihice: cunoștințe, amintiri, imagini, idei, convingeri, moduri de reacție."],
["S2","Stare latentă","informații, amintiri, dorințe sau experiențe existente, dar neaccesibile momentan; pot fi activate de o situație."],
["S2","Stare manifestă","proces psihic exprimat evident prin gânduri, emoții, cuvinte sau comportamente."],
["S2","Manifestări normale","procese psihice care ajută adaptarea și funcționarea în relație cu ceilalți."],
["S2","Manifestări patologice","modificări importante ale gândirii, simțirii sau comportamentului, care afectează semnificativ adaptarea la viața de zi cu zi."],
["S2","Psihic determinat","este influențat de ereditate, dezvoltare biologică, mediu, educație, experiențe personale, relații."],
["S2","Psihic determinant","ceea ce gândim, simțim și ne propunem influențează comportamentul și acțiunea asupra mediului."],
["S2","Procese psihice cognitive","procese de cunoaștere: primesc, prelucrează, păstrează și folosesc informații despre lume și despre sine."],
["S2","Procese cognitiv-senzoriale","cunoaștere prin contact direct cu realitatea, prin organe de simț: senzația, percepția, reprezentarea."],
["S2","Procese cognitiv-intelectuale","prelucrare complexă a informațiilor: gândirea, memoria, imaginația."],
["S2","Procese psihice reglatorii","procese care orientează, mobilizează și controlează comportamentul: motivația, afectivitatea, voința."],
["S2","Motivația","oferă motive și determină acțiunea pentru atingerea scopurilor."],
["S2","Procese afective","modul în care trăim și evaluăm situațiile, prin emoții și sentimente."],
["S2","Voința","mobilizarea și controlul acțiunilor pentru atingerea unui scop, inclusiv în fața dificultăților."],
["S22","Ipostazele psihicului","conștientul, subconștientul și inconștientul; niveluri ale vieții psihice aflate în relație și influențându-se reciproc."],
["S22","Conștiința","formă de manifestare a psihicului prin care ești conștient de lume, de propriile gânduri, emoții și acțiuni și poți reflecta asupra lor."],
["S22","Conștiința implicită","orientare asupra unei situații fără analiza clară și detaliată a fiecărui element."],
["S22","Conștiința reflexivă (explicită)","reflecție intenționată asupra situației: analiza cauzelor și consecințelor, decizii deliberate."],
["S22","Funcția cognitivă a conștiinței","cunoașterea și înțelegerea lumii și a propriei persoane; analiza, compararea și folosirea informațiilor."],
["S22","Funcția proiectivă","orientarea spre viitor, imaginarea a ceea ce vrem să realizăm, stabilirea obiectivelor."],
["S22","Funcția anticipativă","imaginarea evenimentelor viitoare și a consecințelor propriilor acțiuni."],
["S22","Funcția de reglare","controlul și organizarea comportamentului în funcție de scopuri."],
["S22","Conștiința de sine","capacitatea de a te percepe și analiza ca persoană distinctă: gânduri, emoții, comportamente, calități, limite."],
["S22","Subconștientul","nivel între conștient și inconștient; informații, amintiri, deprinderi și automatisme care nu sunt în atenție, dar pot fi reactualizate."],
["S22","Automatism","acțiune formată prin repetare, care nu mai necesită atenție conștientă."],
["S22","Inconștientul","nivel care cuprinde procese, impulsuri, dorințe, amintiri și alte conținuturi de care persoana nu este conștientă direct."],
["S22","Refularea (Freud)","îndepărtarea din conștiință a experiențelor neplăcute sau a conflictelor psihice; conținutul refulat continuă să influențeze indirect."],
["S22","Principiul plăcerii (Freud)","tendința de a căuta satisfacerea dorințelor și de a evita neplăcerea."],
["S22","Conflict psihic","tensiune între ceea ce ne dorim și ceea ce considerăm că putem sau trebuie să facem."],
["S22","Modelul aisbergului (Freud)","partea vizibilă este conștientul; partea imersată cuprinde preconștientul (subconștientul) și inconștientul."],
["S3","Procese cognitive senzoriale","forme de bază ale cunoașterii realității prin organele de simț: senzația, percepția, reprezentarea."],
["S3","Senzația (S3)","proces psihic prin care sunt reflectate însușirile simple, elementare ale obiectelor și fenomenelor, prin acțiunea directă a stimulilor asupra organelor de simț."],
["S3","Imagine primară","imagine rezultată din contactul direct dintre stimul și analizator (senzația, percepția)."],
["S3","Intensitatea senzației","cât de puternic este resimțit stimulul."],
["S3","Natura senzației","tipul senzației: vizuală, auditivă, gustativă, olfactivă, cutanată, kinestezică."],
["S3","Durata senzației","perioada în care senzația este prezentă."],
["S3","Tonalitatea afectivă","caracterul plăcut sau neplăcut al experienței senzoriale."],
["S3","Percepția (S3)","formă complexă de cunoaștere senzorială, prin care se formează o imagine unitară și organizată a obiectului, prin integrarea și interpretarea informațiilor senzoriale."],
["S3","Reprezentarea","proces psihic prin care se formează o imagine mintală secundară a unui obiect absent din câmpul perceptiv."],
["S3","Imagine secundară","imagine formată pe baza unor percepții anterioare, fără acțiunea directă a stimulului."],
["S3","Caracter schematic al reprezentării","păstrează doar însușirile caracteristice, nu toate detaliile obiectului."],
["S3","Caracter intuitiv al reprezentării","păstrează elemente concrete ale obiectului."],
["S3","Reprezentarea ca stare intermediară","formă aflată între procesele cognitive senzoriale și cele superioare; poate fi modificată voluntar."],
["S4","Senzațiile","cea mai simplă și prima formă de cunoaștere senzorială a lumii exterioare și a stărilor organismului."],
["S4","Receptori","celule specializate care transformă stimulii în impulsuri nervoase."],
["S4","Stimul","formă de energie sau acțiune asupra organelor senzoriale care poate produce o senzație (lumină, unde sonore, temperatură, presiune, substanțe chimice)."],
["S4","Senzații exteroceptive","au sursa în mediul extern: vizuale, auditive, olfactive, gustative, cutanate."],
["S4","Senzații proprioceptive","informează despre poziția și mișcarea propriului corp."],
["S4","Senzații interoceptive","provin din mediul intern al organismului: foame, sete, greață, sațietate."],
["S4","Postefect (imagine consecutivă)","persistența senzației după încetarea stimulului."],
["S4","Senzații vizuale","apar prin stimularea receptorilor vizuali de unde electromagnetice; culorile au luminozitate, tonalitate cromatică și saturație."],
["S4","Senzații auditive","produse de vibrații transmise ca unde sonore; amplitudinea dă intensitatea, frecvența dă înălțimea, forma undei dă timbrul."],
["S4","Efectul Doppler","schimbarea înălțimii percepute a sunetului când sursa se apropie sau se îndepărtează."],
["S4","Senzații cutanate","apar prin stimularea receptorilor pielii; includ senzațiile tactile, termice și de durere."],
["S4","Senzații tactile","informează despre presiune, duritate, asperitate, textură."],
["S4","Senzații termice","determinate de diferența dintre temperatura corpului și a obiectului; contribuie la adaptarea termică."],
["S4","Senzații de durere","semnalează stimuli care pot produce leziuni; rol de protecție."],
["S4","Senzații olfactive","apar când substanțe volatile stimulează receptorii olfactivi din fosele nazale."],
["S4","Senzații gustative","apar când substanțe solubile stimulează receptorii gustativi; gusturi fundamentale: dulce, acru, sărat, amar."],
["S4","Pragul absolut","cea mai mică intensitate a unui stimul care poate fi percepută."],
["S4","Sensibilitate","capacitatea de a sesiza stimuli de intensitate redusă; cu cât stimulul necesar este mai slab, cu atât sensibilitatea e mai mare."],
["S4","Pragul diferențial","modificarea minimă a intensității unui stimul care poate fi sesizată."],
["S4","Legea pragurilor diferențiale","pentru a sesiza o creștere a senzației este necesară adăugarea unei proporții din intensitatea inițială a stimulului."],
["S4","Legile sensibilității","legi care explică modificarea sensibilității în funcție de intensitatea stimulului, repetare, alți stimuli, nevoi și interacțiunea analizatorilor."],
["S4","Legea proporționalității inverse","sensibilitate mai mare înseamnă stimul necesar mai slab (prag absolut mai scăzut); sensibilitate mai mică înseamnă stimul necesar mai intens."],
["S4","Legea pragurilor absolute","pentru fiecare analizator există un prag inferior (intensitatea minimă) și un prag superior (intensitatea maximă) ale stimulului care produce senzația."],
["S4","Legea adaptării","sensibilitatea crește sau scade în funcție de intensitatea și repetarea stimulului."],
["S4","Adaptare ascendentă","creșterea sensibilității la acțiunea frecventă a unui stimul slab."],
["S4","Adaptare descendentă","scăderea sensibilității la acțiunea frecventă a unui stimul puternic."],
["S4","Legea contrastului senzorial","sensibilitatea este influențată de acțiunea simultană sau succesivă a unor stimuli diferiți."],
["S4","Contrast succesiv","stimulii se succed, iar primul influențează senzația produsă de următorul."],
["S4","Contrast simultan","doi stimuli sunt recepționați în același timp."],
["S4","Legea semnificației (senzații)","sensibilitatea crește față de stimulii concordanți cu starea, nevoile și scopul activității și scade față de cei neconcordanți."],
["S4","Legea sinesteziei","asocierea senzațiilor din modalități senzoriale diferite (de exemplu sunete asociate cu culori)."],
["S5","Percepția","proces psihic cognitiv senzorial prin care omul cunoaște obiectele, fenomenele și situațiile din mediu, integrând și interpretând informațiile simțurilor."],
["S5","Caracter activ și selectiv","percepția organizează, selectează și interpretează informațiile; nu este o simplă sumă a senzațiilor."],
["S5","Detecția stimulului","sesizarea faptului că există un stimul."],
["S5","Discriminarea stimulului","diferențierea stimulului de ceilalți stimuli."],
["S5","Identificarea","recunoașterea obiectului și încadrarea lui într-o categorie cunoscută."],
["S5","Interpretarea","atribuirea unei semnificații obiectului sau situației, pe baza experienței și cunoștințelor."],
["S5","Teoria gestaltistă","teorie germană din prima jumătate a secolului XX: „Întregul este mai mult decât suma părților sale”; percepția este organizare activă în structuri coerente."],
["S5","Figură","elementul asupra căruia se concentrează percepția."],
["S5","Fond","ceea ce se află în jurul figurii."],
["S5","Figuri reversibile","imagini care pot fi organizate în moduri diferite, figura și fondul schimbându-se între ele (vaza sau două profiluri)."],
["S5","Principiul proximității","elementele apropiate sunt percepute ca grup."],
["S5","Principiul similarității","elementele asemănătoare (formă, culoare) sunt grupate perceptiv."],
["S5","Principiul continuității","elementele care par să continue unele în altele sunt percepute ca structură continuă."],
["S5","Principiul închiderii","completăm mental părțile lipsă ale unei figuri și o percepem întreagă."],
["S5","Principiul bunei forme","tendința de a organiza stimulii într-o formă simplă, regulată, stabilă, ușor de recunoscut."],
["S5","Legea integralității-structuralității","obiectele sunt percepute ca întreg organizat, nu ca sumă de însușiri."],
["S5","Legea selectivității","în funcție de context și activitate, unii stimuli devin figură, ceilalți fond."],
["S5","Legea constanței perceptive","tendința de a percepe obiectele ca relativ constante, deși informațiile senzoriale se modifică."],
["S5","Constanța perceptivă","percepția obiectelor cu formă și mărime relativ constante, indiferent de unghiul din care sunt privite."],
["S5","Legea obiectualității","percepția este orientată spre obiecte și fenomene concrete, cărora le atribuim însușiri."],
["S5","Legea semnificației (percepții)","ceea ce percepem are sens pentru noi, prin experiența și cunoștințele anterioare."],
["S5","Percepția spațială","apreciază forma, mărimea, poziția, distanța și perspectiva obiectelor și permite orientarea în spațiul tridimensional."],
["S5","Indicatori monoculari","informații despre adâncime și distanță utilizabile cu un singur ochi."],
["S5","Mărimea relativă","un obiect asemănător care formează o imagine mai mică pe retină este perceput ca mai îndepărtat."],
["S5","Interpoziția","obiectul care acoperă parțial un altul este perceput ca mai apropiat."],
["S5","Perspectiva liniară","liniile paralele par să se apropie pe măsură ce se îndepărtează."],
["S5","Indicatori binoculari","informații despre adâncime care presupun folosirea ambilor ochi."],
["S5","Disparitatea retiniană","fiecare ochi primește o imagine ușor diferită; integrarea lor produce percepția tridimensională."],

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const app=document.getElementById("app");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function renderFilters(){
  const f=document.getElementById("filters");
  f.innerHTML='<span class="lbl">Lecții</span>'+Object.entries(LESSONS).map(([k,v])=>`<button class="chip" data-l="${k}" aria-pressed="${lessons.has(k)}">${v}</button>`).join("");
  f.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const l=b.dataset.l;if(lessons.has(l)){if(lessons.size>1)lessons.delete(l)}else lessons.add(l);store.set("psiho_lessons",[...lessons]);renderFilters();start()});
}
function foot(){const p=pool();const k=p.filter(x=>known.has(x.id)).length;
  document.getElementById("foot").textContent=`Știi ${k} din ${p.length} definiții în lecțiile alese.`}

/* FISE */
let deck=[],di=0,shown=false;
function fise(){
  const p=pool();deck=shuffle(p.filter(x=>!known.has(x.id)));
  if(!deck.length){app.innerHTML=`<section class="panel"><p class="term">Le știi pe toate.</p><p class="def">Toate cele ${p.length} definiții din lecțiile alese sunt marcate ca știute.</p><div class="row"><button class="btn primary" id="reset">Ia-le de la capăt</button></div></section>`;
    document.getElementById("reset").onclick=()=>{p.forEach(x=>known.delete(x.id));store.set("psiho_known",[...known]);start()};return}
  di=0;shown=false;drawFisa();
}
function drawFisa(){
  const c=deck[di];const left=deck.length-di;
  app.innerHTML=`<section class="panel">
   <div class="meta"><span>${LESSONS[c.l]}</span><span>${left} rămase</span></div>
   <p class="term">${esc(c.t)}</p>
   ${shown?`<p class="def">${esc(cap(c.d))}</p>`:`<p class="hidden-def">Spune definiția cu voce tare sau scrie-o, apoi verifică.</p>`}
   <div class="row">${shown?`<button class="btn bad" id="no">Nu o știu</button><button class="btn good" id="yes">O știu</button>`:`<button class="btn primary" id="show">Arată definiția</button>`}</div>
  </section>`;
  if(!shown)document.getElementById("show").onclick=()=>{shown=true;drawFisa()};
  else{
    document.getElementById("yes").onclick=()=>{known.add(c.id);store.set("psiho_known",[...known]);next(false)};
    document.getElementById("no").onclick=()=>next(true);
  }
  foot();
}
function next(again){const c=deck[di];if(again){const pos=Math.min(deck.length,di+3+Math.floor(Math.random()*3));deck.splice(pos,0,c)}di++;shown=false;
  if(di>=deck.length){fise();return}drawFisa()}

/* QUIZ */
let qs=[],qi=0,qscore=0,qwrong=[];
function quiz(){
  const p=pool();qs=shuffle(p).slice(0,15).map(c=>{
    const rev=Math.random()<.5;
    const others=shuffle(p.filter(x=>x.id!==c.id&&x.l===c.l).concat(shuffle(D.filter(x=>x.id!==c.id)))).filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i).slice(0,3);
    return rev?{q:`Ce termen are definiția: „${cap(c.d)}”`,a:c.t,opts:shuffle([c.t,...others.map(o=>o.t)]),c}
              :{q:`Care este definiția termenului „${c.t}”?`,a:c.d,opts:shuffle([c.d,...others.map(o=>o.d)]),c};
  });qi=0;qscore=0;qwrong=[];drawQ();
}
function drawQ(){
  if(qi>=qs.length){result(qscore,qs.length,qwrong.map(w=>`<div><b>${esc(w.c.t)}</b> – ${esc(w.c.d)}</div>`),quiz);return}
  const x=qs[qi];
  app.innerHTML=`<section class="panel">
   <div class="meta"><span>Întrebarea ${qi+1} / ${qs.length}</span><span>${qscore} corecte</span></div>
   <div class="bar"><i style="width:${qi/qs.length*100}%"></i></div>
   <p class="q">${esc(x.q)}</p>
   <div class="opts">${x.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(cap(o))}</button>`).join("")}</div>
   <p class="feedback" id="fb"></p>
   <div class="row" id="nx" hidden><button class="btn primary" id="nextq">Următoarea</button></div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const pick=x.opts[+b.dataset.i];const ok=pick===x.a;
    app.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(x.opts[+o.dataset.i]===x.a)o.classList.add("ok")});
    if(ok){qscore++;document.getElementById("fb").textContent="Corect."}
    else{b.classList.add("no");qwrong.push(x);known.delete(x.c.id);store.set("psiho_known",[...known]);document.getElementById("fb").innerHTML=`Greșit. <b>${esc(x.c.t)}</b>: ${esc(x.c.d)}`}
    document.getElementById("nx").hidden=false;document.getElementById("nextq").onclick=()=>{qi++;drawQ()};
  });
}
function result(s,n,wrongHtml,again){
  app.innerHTML=`<section class="panel">
   <p class="score">${s} / ${n}</p>
   <p class="def">${s===n?"Toate corecte.":s>=n*.7?"Bine. Revezi greșelile de mai jos.":"Revezi definițiile de mai jos și reia testul."}</p>
   ${wrongHtml.length?`<div class="glos">${wrongHtml.join("")}</div>`:""}
   <div class="row"><button class="btn primary" id="again">Încă o rundă</button></div>
  </section>`;document.getElementById("again").onclick=again;foot();
}

  const x=ls[li];
  app.innerHTML=`<section class="panel">

}

  s.oninput=draw;draw();foot();
}

const MODES={fise,quiz,exemple,liste,confuzii,toate};
function start(){MODES[mode]();foot()}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));store.set("psiho_mode",mode);start()});
const sm=store.get("psiho_mode","fise");if(MODES[sm]){mode=sm;document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.m===mode))}
renderFilters();start();
</script>
</body>
